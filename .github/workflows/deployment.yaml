name: Deployment-CI-Pipeline-Conduit-Container

on: 
  push:
    branches: 
      - dev

permissions:
  contents: read
  packages: write

jobs: 
  build:
    name: Build & Push Images
    runs-on: ubuntu-22.04
    
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./conduit-frontend
          file: ./conduit-frontend/frontend.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/conduit-container/frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/conduit-container/frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./conduit-backend
          file: ./conduit-backend/backend.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/conduit-container/backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/conduit-container/backend:latest

  deploy:
    name: Deploy Application
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat <<EOF > .env
          BACKEND_API_URL=${{ secrets.BACKEND_API_URL }}

          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_LOGLEVEL=${{ secrets.DJANGO_LOGLEVEL }}
          DEBUG=${{ secrets.DEBUG }}
          DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}

          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
          CORS_ALLOW_CREDENTIALS=${{ secrets.CORS_ALLOW_CREDENTIALS }}
          CORS_ORIGIN_WHITELIST=${{ secrets.CORS_ORIGIN_WHITELIST }}

          DATABASE_ENGINE=${{ secrets.DATABASE_ENGINE }}
          DATABASE_NAME=${{ secrets.DATABASE_NAME }}
          DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
          DATABASE_HOST=${{ secrets.DATABASE_HOST }}
          DATABASE_PORT=${{ secrets.DATABASE_PORT }}
          EOF
        shell: bash

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".env,docker-compose.yml"
          target: "/tmp"

      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ vars.PATH_TO_PROJECT_FOLDER }}
            
            mv /tmp/.env ${{ vars.PATH_TO_PROJECT_FOLDER }}/.env
            mv /tmp/docker-compose.yml ${{ vars.PATH_TO_PROJECT_FOLDER }}/docker-compose.yml
            
            cd ${{ vars.PATH_TO_PROJECT_FOLDER }}
            
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker compose pull
            docker compose up -d --remove-orphans
            
            docker image prune -f